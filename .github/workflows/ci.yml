name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check src/

      - name: Run mypy type checking
        run: uv run mypy src/

      - name: Verify sources compile
        run: uv run python -m compileall src

      - name: Run tests with coverage
        run: uv run pytest --cov=mcp_govt_api --cov-report=xml

      - name: Smoke test package imports
        run: uv run python -c "import mcp_govt_api; import mcp_govt_api.server"

      - name: Validate package build
        run: uv build

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
